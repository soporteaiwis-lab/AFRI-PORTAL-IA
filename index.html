
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AFRI | Portal de IA Corporativa</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@300;400;600&family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                        mono: ['"Fira Code"', 'monospace'],
                    },
                    colors: {
                        primary: '#3b82f6', 
                        secondary: '#8b5cf6',
                        cobol: '#4ade80', 
                        dark: '#030712',
                        darker: '#000000',
                        surface: '#0f172a',
                        terminal: '#000000'
                    },
                    animation: {
                        'pulse-glow': 'pulseGlow 2s ease-in-out infinite',
                        'scanline': 'scanline 8s linear infinite',
                        'float': 'float 4s ease-in-out infinite',
                        'spin-slow': 'spin 8s linear infinite',
                    },
                    keyframes: {
                        pulseGlow: {
                            '0%, 100%': { opacity: '0.4', filter: 'drop-shadow(0 0 5px #4ade80)' },
                            '50%': { opacity: '0.8', filter: 'drop-shadow(0 0 15px #4ade80)' },
                        },
                        scanline: {
                            '0%': { transform: 'translateY(-100%)' },
                            '100%': { transform: 'translateY(100%)' }
                        },
                        float: {
                            '0%, 100%': { transform: 'translateY(0)' },
                            '50%': { transform: 'translateY(-10px)' }
                        }
                    },
                    padding: {
                        'safe': 'env(safe-area-inset-bottom)'
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #000; overflow-x: hidden; }
        .mainframe-border {
            border: 1px solid rgba(74, 222, 128, 0.2);
            box-shadow: 0 0 10px rgba(74, 222, 128, 0.05);
        }
        
        .ai-glass {
            background: rgba(15, 23, 42, 0.7);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .terminal-text {
            color: #4ade80;
            text-shadow: 0 0 5px rgba(74, 222, 128, 0.5);
        }
        
        .ai-gradient-text {
            background: linear-gradient(to right, #3b82f6, #8b5cf6, #4ade80);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #030712; }
        ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #4ade80; }

        .scanline-effect {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 2px;
            background: rgba(74, 222, 128, 0.1);
            animation: scanline 4s linear infinite;
            pointer-events: none;
            z-index: 50;
        }
        
        /* Mobile Optimizations */
        .pb-safe { padding-bottom: env(safe-area-inset-bottom); }
    </style>
<script type="importmap">
{
  "imports": {
    "react/": "https://esm.sh/react@^18.2.0/",
    "react": "https://esm.sh/react@^18.2.0",
    "react-dom/": "https://esm.sh/react-dom@^18.2.0/",
    "react-dom": "https://esm.sh/react-dom@^18.2.0",
    "@google/genai": "https://esm.sh/@google/genai@^0.1.1",
    "lucide-react": "https://esm.sh/lucide-react@^0.300.0",
    "react-router-dom": "https://esm.sh/react-router-dom@^6.21.1",
    "firebase/": "https://esm.sh/firebase@^10.7.1/",
    "@firebase/app": "https://esm.sh/@firebase/app@^0.14.8"
  }
}
</script>
</head>
<body class="bg-darker text-slate-200 antialiased font-sans h-full">
    <div id="root" class="h-full"></div>
</body>
</html>
