<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AFRI | Portal de IA Corporativa</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@300;400;600&family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
    
    <script>
        // FAILSAFE: Si React falla o tarda mucho, forzar la entrada a los 3 segundos.
        setTimeout(() => {
            const loader = document.getElementById('app-loader');
            const forceBtn = document.getElementById('force-entry-btn');
            if (loader && forceBtn) {
                forceBtn.style.display = 'block';
                console.warn("Tiempo de carga excedido. Habilitando entrada forzada.");
            }
        }, 2000);

        window.forceEntry = function() {
            const loader = document.getElementById('app-loader');
            if(loader) loader.style.display = 'none';
        }

        // Error Handler
        window.onerror = function(message, source, lineno, colno, error) {
            console.error("Global Error:", message);
            // Si hay error critico, matamos el loader para ver si la UI renderizó algo
            const loader = document.getElementById('app-loader');
            if (loader) loader.style.display = 'none';
        };
    </script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                        mono: ['"Fira Code"', 'monospace'],
                    },
                    colors: {
                        primary: '#3b82f6', 
                        secondary: '#8b5cf6',
                        cobol: '#4ade80', 
                        dark: '#030712',
                        darker: '#000000',
                        surface: '#0f172a',
                        terminal: '#000000'
                    },
                    animation: {
                        'pulse-glow': 'pulseGlow 2s ease-in-out infinite',
                        'scanline': 'scanline 8s linear infinite',
                        'spin-slow': 'spin 8s linear infinite',
                    },
                    keyframes: {
                        pulseGlow: {
                            '0%, 100%': { opacity: '0.4', filter: 'drop-shadow(0 0 5px #4ade80)' },
                            '50%': { opacity: '0.8', filter: 'drop-shadow(0 0 15px #4ade80)' },
                        },
                        scanline: {
                            '0%': { transform: 'translateY(-100%)' },
                            '100%': { transform: 'translateY(100%)' }
                        }
                    },
                    padding: {
                        'safe': 'env(safe-area-inset-bottom)'
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #000; overflow-x: hidden; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #030712; }
        ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 10px; }
        .pb-safe { padding-bottom: env(safe-area-inset-bottom); }
    </style>
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@18.2.0",
    "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
    "react-dom": "https://esm.sh/react-dom@18.2.0",
    "react-router-dom": "https://esm.sh/react-router-dom@6.21.1",
    "@google/genai": "https://esm.sh/@google/genai@0.1.1",
    "lucide-react": "https://esm.sh/lucide-react@0.300.0",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
    "react/": "https://esm.sh/react@^19.2.4/"
  }
}
</script>
</head>
<body class="bg-darker text-slate-200 antialiased font-sans h-full">
    
    <!-- Loader Seguro -->
    <div id="app-loader" style="position: fixed; inset: 0; background: #000; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #4ade80; font-family: monospace;">
        <div style="width: 50px; height: 50px; border: 4px solid #1e293b; border-top-color: #4ade80; border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 20px;"></div>
        <div style="letter-spacing: 2px; font-weight: bold;">CARGANDO SISTEMA...</div>
        
        <!-- Botón de emergencia oculto por defecto -->
        <button id="force-entry-btn" onclick="window.forceEntry()" style="display: none; margin-top: 30px; background: #ef4444; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-family: sans-serif; font-weight: bold;">
            ⚠️ ¿Tarda mucho? Clic para entrar
        </button>

        <style>@keyframes spin { 100% { transform: rotate(360deg); } }</style>
    </div>

    <div id="root" class="h-full"></div>
</body>
</html>
